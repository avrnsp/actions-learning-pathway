name: Read Values
on : 
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Name the environment to read'
        required: true
        options:
          - TST
jobs:
  read-value-job:
    runs-on: ubuntu-slim
    environment: ${{github.event.inputs.environment}}
    steps:
      - name: read value
        env:
          MY_VALUE: ${{secrets.SECRET1}}
        run: |
          SECRET_VALUE="${{secrets.SECRET1}}"
          echo "${SECRET_VALUE:0:1} ${SECRET_VALUE:1}" | base64
