name: Read Values
on : 
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Name the environment to read'
        required: true
        options:
          - TST
      readvalue:
        type: string
        description: 'Provide the value to read'
        required: true
jobs:
  read-value-job:
    runs-on: ubuntu-slim
    environment: ${{github.event.inputs.environment}}
    steps:
      - name: read value
        env:
          secret1 : ${{secrets.SECRET1}}
        run: |
          echo "${secret1:0:1} {secret1:1}"
